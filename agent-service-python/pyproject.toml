[project]
name = "insighthub-agent-service"
version = "0.1.0"
description = "InsightHub Python Agent service (LangGraph multi-agent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.20",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "langchain-deepseek>=0.1.0",
  "redis>=5.0.0",
  "psycopg[binary]>=3.2.0",
  "pypdf>=5.0.0",
  # 固定版本避免 Ubuntu Agent 与 Sandbox 在分词行为上漂移。
  "tiktoken==0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
