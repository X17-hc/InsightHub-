server:
  port: ${JAVA_SERVER_PORT:8080}

spring:
  application:
    name: insighthub-backend
  servlet:
    multipart:
      # 需覆盖 Spring 默认 1MB，对齐 insighthub.upload.max-bytes（5MB）
      max-file-size: 6MB
      max-request-size: 6MB
  datasource:
    url: ${MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:3306/insighthub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  autoconfigure:
    exclude:
      # 使用自定义 RedissonConfig，避免 starter 对空密码误发 AUTH
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

insighthub:
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${AGENT_INTERNAL_TOKEN:}
    connect-timeout-ms: 5000
    read-timeout-ms: 300000
  upload:
    root-dir: ${UPLOAD_ROOT_DIR:./data/uploads}
    max-bytes: 5242880
  task:
    default-timeout-seconds: ${TASK_TIMEOUT_SECONDS:300}
    create-rate-per-minute: ${TASK_CREATE_RATE_PER_MINUTE:10}
    sse-heartbeat-seconds: 15
  jwt:
    # 至少 32 字节；未配置时拒绝启动
    secret: ${JWT_SECRET:}
    access-expire-minutes: 120
    refresh-expire-days: 7
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:false}
    user-id: user-demo
    workspace-id: workspace-demo
    user-b-id: user-demo-b
    workspace-b-id: workspace-demo-b
  docs:
    # false 时 Knife4j/OpenAPI 需登录
    public-access: ${DOCS_PUBLIC_ACCESS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    # 注解 SQL 与 BaseMapper 均将 snake_case 列映射到驼峰字段
    map-underscore-to-camel-case: true

logging:
  level:
    com.hechang.insighthub: INFO
