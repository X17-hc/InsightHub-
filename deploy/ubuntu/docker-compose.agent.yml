services:
  redis:
    # The VM cannot reach registry-1.docker.io directly. The mirror is only a
    # transport endpoint: this immutable Docker Hub manifest digest is checked
    # by Docker before the image may be used.
    image: docker.m.daocloud.io/library/redis@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["/opt/insighthub/volumes/redis:/data"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  pgvector:
    image: docker.m.daocloud.io/pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-insighthub_vector}
    volumes:
      - /opt/insighthub/volumes/pgvector:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
